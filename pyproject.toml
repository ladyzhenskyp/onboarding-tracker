[project]
name = "onboarding-tracker"
version = "0.1.0"
description = "Client onboarding / implementation tracker with a rule-based risk engine"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, B = bugbear, UP = pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
# UP017 wants datetime.UTC (3.11+); we keep timezone.utc so the code also runs on 3.10.
ignore = ["UP017"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies as call-defaults (Depends/Query/Form): that is by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Form", "fastapi.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
