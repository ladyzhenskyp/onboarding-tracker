<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Onboarding Tracker{% endblock %}</title>
  {# Minimal styling so pages are readable in Phase 2. Tailwind + HTMX arrive in Phase 3. #}
  <style>
    :root { --ink:#1b2a41; --muted:#6b7a8c; --line:#dde2e6; --bg:#f6f7f5; --red:#c53030; --amber:#b7791f; --green:#2f855a; }
    body { margin:0; font: 15px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color:var(--ink); background:var(--bg); }
    header.top { background:#fff; border-bottom:1px solid var(--line); padding:10px 24px; display:flex; gap:20px; align-items:center; }
    header.top a { color:var(--ink); text-decoration:none; font-weight:500; }
    header.top a.brand { font-weight:700; margin-right:8px; }
    header.top a.active { color:#0e7c7b; }
    main { max-width:1180px; margin:0 auto; padding:24px; }
    h1 { font-size:1.5rem; margin:0 0 16px; } h2 { font-size:1.1rem; margin:24px 0 8px; }
    table { border-collapse:collapse; width:100%; background:#fff; font-size:14px; }
    th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
    .num { text-align:right; font-variant-numeric:tabular-nums; }
    .badge { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; font-weight:600; color:#fff; }
    .badge.red{background:var(--red)} .badge.amber{background:var(--amber)} .badge.green{background:var(--green)}
    .sev { font-size:12px; font-weight:600; text-transform:uppercase; }
    .sev.critical{color:var(--red)} .sev.high{color:#c05621} .sev.medium{color:var(--amber)} .sev.low{color:var(--muted)}
    .muted { color:var(--muted); } .small { font-size:13px; }
    .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
    .tile { background:#fff; border:1px solid var(--line); padding:12px 14px; }
    .tile .n { font-size:1.6rem; font-weight:600; } .tile .l { font-size:12px; color:var(--muted); text-transform:uppercase; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:24px; } @media (max-width:800px){ .grid2{grid-template-columns:1fr} }
    .board { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; } @media (max-width:900px){ .board{grid-template-columns:1fr} }
    .col { background:#eceff2; padding:10px; } .col h3 { margin:0 0 10px; font-size:14px; }
    .card { background:#fff; border:1px solid var(--line); padding:8px 10px; margin-bottom:8px; font-size:13px; }
    .card a { color:var(--ink); font-weight:600; text-decoration:none; }
    form.inline { display:inline; } form.stack { display:grid; gap:6px; max-width:420px; background:#fff; border:1px solid var(--line); padding:12px; }
    input, select, textarea, button { font:inherit; padding:5px 8px; border:1px solid #b9c2cc; border-radius:3px; }
    button { background:#0e7c7b; color:#fff; border-color:#0e7c7b; cursor:pointer; } button.quiet { background:#fff; color:var(--ink); border-color:#b9c2cc; }
    .flash { background:#fbf0d9; border:1px solid var(--amber); padding:8px 12px; margin-bottom:16px; }
    .timeline { display:flex; gap:6px; margin:12px 0 20px; } .tl { flex:1; padding:8px; border-top:4px solid var(--line); background:#fff; font-size:13px; }
    .tl.done{border-top-color:var(--green)} .tl.current{border-top-color:#0e7c7b; font-weight:600}
    ul.reasons { margin:6px 0 0; padding-left:18px; }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Onboarding Tracker</a>
    <a href="/" class="{{ 'active' if request.url.path == '/' }}">Dashboard</a>
    <a href="/pipeline" class="{{ 'active' if request.url.path.startswith('/pipeline') }}">Pipeline</a>
    <a href="/clients" class="{{ 'active' if request.url.path.startswith('/clients') }}">Clients</a>
    <a href="/blockers" class="{{ 'active' if request.url.path.startswith('/blockers') }}">Blockers</a>
    <a href="/team" class="{{ 'active' if request.url.path.startswith('/team') }}">Team</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
